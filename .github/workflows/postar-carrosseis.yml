name: Postar Carrosséis no Instagram

on:
  schedule:
    # 18:30 horário de Brasília (UTC-3) = 21:30 UTC -> carrosséis
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: postar-instagram
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r script/requirements.txt

      - name: Executar agente de postagem (carrosséis)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python script/postar_instagram.py --modo carrosseis
